# Start everything:           docker compose up -d --build
# Run a producer (one-off):   docker compose run --rm kafka-tools python kafka/producers/customer_producer.py
# Reset everything (DELETES DATA):  docker compose down -v
x-superset-common: &superset-common
  image: apache/superset:4.0.2
  env_file: .env
  environment:
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    PYTHONPATH: /app/pythonpath
  volumes:
    - ./superset:/app/pythonpath
x-airflow-common: &airflow-common
  build: ./airflow
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
    # Inside Docker the hosts are service names, not localhost.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    KAFKA_BOOTSTRAP: kafka:29092
    PROJECT_ROOT: /opt/airflow/project
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./pipelines:/opt/airflow/project/pipelines
    - ./sql:/opt/airflow/project/sql
    - ./kafka:/opt/airflow/project/kafka
    - ./data_generator:/opt/airflow/project/data_generator
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  # ---------------- Warehouse database ----------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs 001..006 in order, only the FIRST time the volume is created.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off job: loads the seed files (safe to repeat, they use ON CONFLICT).
  db-seed:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./database/seeds:/seeds:ro
    restart: "no"
    command:
      - sh
      - -c
      - |
        until pg_isready -h postgres -q; do sleep 2; done
        for f in /seeds/*.sql; do
          echo "seeding $$f"
          psql -v ON_ERROR_STOP=1 -q -f "$$f" || exit 1
        done

  # ---------------- Kafka (KRaft mode, no Zookeeper) ----------------
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"          # for scripts running on your machine
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-off job: creates the three topics.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command:
      - sh
      - -c
      - |
        for t in ${CUSTOMER_TOPIC:-customer_events} ${ACCOUNT_TOPIC:-account_events} ${TRANSACTION_TOPIC:-transaction_events}; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$t" --partitions ${KAFKA_PARTITIONS:-3} --replication-factor 1
        done

  # ---------------- Airflow ----------------
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
  
  superset-init:
      <<: *superset-common
      depends_on:
        airflow-db:
          condition: service_healthy
      restart: "no"
      user: root
      command:
        - sh
        - -c
        - |
          superset db upgrade
          superset fab create-admin --username admin --firstname Admin --lastname User \
            --email admin@example.com --password "$${SUPERSET_ADMIN_PASSWORD}" || true
          superset init

  superset:
    <<: *superset-common
    ports:
      - "8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    command: ["superset", "run", "-h", "0.0.0.0", "-p", "8088", "--with-threads"]

  # ---------------- Tools (not started by default) ----------------
  # docker compose run --rm kafka-tools python kafka/producers/customer_producer.py
  kafka-tools:
    build:
      context: .
      dockerfile: kafka/Dockerfile
    profiles: ["tools"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    

volumes:
  pgdata:
  airflow_db_data:
  kafka_data: